<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',building:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h1m4 0h1M9 11h1m4 0h1M9 15h1m4 0h1M10 21v-3h4v3"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',down:'<path d="m6 9 6 6 6-6"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 2M5 16a8 8 0 0 0 13 2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',layers:'<path d="m12 3 10 5-10 5L2 8l10-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8m-8 4h5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',external:'<path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>',network:'<rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4M5 16v-4h14v4"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="M12 8v5m0 3v.1"/>',check:'<path d="m5 12 4 4L19 6"/>',sliders:'<path d="M4 7h5m4 0h7M4 17h9m4 0h3"/><circle cx="11" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>',pin:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/>'};
function icon(name,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.info}</svg>`}
function star(x,y,size=2.3){let pts=[];for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?size*.43:size;pts.push(`${(x+Math.cos(a)*r).toFixed(2)},${(y+Math.sin(a)*r).toFixed(2)}`)}return `<polygon class="star" points="${pts.join(' ')}"/>`}
function crown(cls='brand-mark',letter=true){return `<svg class="${cls}" viewBox="0 0 48 48" aria-hidden="true"><g fill="currentColor">${Array.from({length:12},(_,i)=>{let a=i*Math.PI/6-Math.PI/2;return star(24+19*Math.cos(a),24+19*Math.sin(a),2)}).join('')}</g>${letter?'<path d="M29 17a9 9 0 1 0 0 14" fill="none" stroke="#075F87" stroke-width="2.8" stroke-linecap="round"/>':''}</svg>`}
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const Motion={tokens:{page:260,list:180,step:24,maxDelay:120,modalIn:240,modalOut:160,hover:160,numbers:180,shine:220,loader:2000,enter:'cubic-bezier(.16,1,.3,1)',exit:'cubic-bezier(.4,0,1,1)',soft:'cubic-bezier(.2,0,.2,1)'},
 animate(el,frames,options){if(!el||!el.animate)return null;return el.animate(frames,{...options,duration:reduce.matches?0:options.duration,delay:reduce.matches?0:options.delay||0})},
 enter(el,type='page'){const modal=type==='modal',scale=modal?['scale(.98)','scale(1)']:['translateY(8px)','translateY(0)'];return this.animate(el,[{opacity:0,transform:reduce.matches?'none':scale[0]},{opacity:1,transform:reduce.matches?'none':scale[1]}],{duration:modal?this.tokens.modalIn:this.tokens.page,easing:this.tokens.enter})},
 exit(el,type='page'){return this.animate(el,[{opacity:1,transform:'none'},{opacity:0,transform:reduce.matches?'none':type==='modal'?'scale(.98)':'translateY(-8px)'}],{duration:this.tokens.modalOut,easing:this.tokens.exit})},
 stagger(list){[...list].forEach((el,i)=>this.animate(el,[{opacity:0,transform:reduce.matches?'none':'translateY(8px)'},{opacity:1,transform:'none'}],{duration:this.tokens.list,delay:Math.min(i*this.tokens.step,this.tokens.maxDelay),easing:this.tokens.enter,fill:'backwards'}))},
 async countTo(el,from,to){el.textContent=formatNumber(from);if(from===to)return;const a=this.animate(el,[{opacity:1},{opacity:0}],{duration:this.tokens.numbers/2,easing:this.tokens.soft});if(a)await a.finished.catch(()=>{});el.textContent=formatNumber(to);this.animate(el,[{opacity:0},{opacity:1}],{duration:this.tokens.numbers/2,easing:this.tokens.soft})},
 glassShine(el){if(reduce.matches||!el)return;let line=el.querySelector(':scope > .shine');if(!line){line=document.createElement('i');line.className='shine';line.setAttribute('aria-hidden','true');el.append(line)}this.animate(line,[{opacity:0,transform:'translateY(9px) scaleY(.7)'},{opacity:.9,offset:.5},{opacity:0,transform:'translateY(-9px) scaleY(1)'}],{duration:this.tokens.shine,easing:this.tokens.enter})},
 loader(el){if(!reduce.matches)this.animate(el,[{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:this.tokens.loader,easing:'linear',iterations:Infinity})}
};

const legalEs=`<p>Coima es una herramienta de análisis de datos públicos de contrataciones del Estado argentino, publicados oficialmente en COMPR.AR, complementados con indicadores económicos del INDEC y del BCRA. Este prototipo usa únicamente registros ficticios.</p><h3>1. Indicadores estadísticos, no acusaciones</h3><p>Los puntajes, señales y hallazgos son indicadores automáticos y heurísticos sobre datos públicos. Identifican patrones que pueden ameritar revisión humana. No constituyen afirmación, imputación ni prueba de un delito, infracción o irregularidad de una persona o entidad.</p><p>Una correlación estadística no es un delito. Un puntaje alto no implica culpabilidad. Muchos patrones tienen explicaciones lícitas. Toda conclusión requiere verificación independiente y, cuando corresponda, una investigación formal de la autoridad competente.</p><h3>2. Origen y exactitud</h3><p>La exactitud, completitud y actualización dependen de las fuentes originales. Pueden existir errores de extracción, interpretación o datos desactualizados. No se garantiza la corrección de ningún dato individual.</p><h3>3. Datos personales</h3><p>Los datos de funcionarios y empresas pueden ser públicos bajo las normas de contratación y acceso a la información. El tratamiento tiene fines de interés público, transparencia y control ciudadano. Se puede solicitar revisión, rectificación o eliminación de datos inexactos o que afecten a una persona.</p><h3>4. Sin garantías</h3><p>El software y los datos se ofrecen tal cual, sin garantía de ningún tipo. Los autores y colaboradores no asumen responsabilidad por el uso de terceros ni por decisiones basadas en los resultados. El uso queda bajo exclusiva responsabilidad del usuario, conforme a la legislación aplicable.</p><h3>5. Derecho de respuesta, rectificación y baja</h3><p>Una persona o entidad mencionada puede pedir revisión de datos incorrectos, desactualizados o que la perjudiquen indebidamente. Las solicitudes fundadas serán revisadas y, cuando corresponda, se corregirán o removerán los datos en un plazo razonable. En este prototipo, “Solicitar rectificación” permite explorar un formulario de ejemplo, sin enviar información.</p><h3>Registro de aceptación</h3><p>La aceptación de la versión 1.0 y su fecha se guardan solo en este navegador. Una nueva versión requiere una nueva aceptación. Si el almacenamiento no está disponible, se volverá a solicitar al recargar.</p>`;
const legalEn=`<p>Coima analyzes public Argentine government procurement data published on COMPR.AR, complemented by INDEC and BCRA economic indicators. This prototype uses fictional records only.</p><h3>1. Statistical indicators, not accusations</h3><p>Scores, signals and findings are automated heuristic indicators. They identify patterns that may warrant human review and do not assert or prove a crime, offense or irregularity. Statistical correlation is not a crime, a high score does not imply guilt, and many patterns have lawful explanations. Conclusions require independent verification and, where appropriate, formal investigation by competent authorities.</p><h3>2. Data source and accuracy</h3><p>Accuracy, completeness and freshness depend on original public sources. Extraction errors, interpretation errors and outdated records may exist. No individual data point is guaranteed to be correct.</p><h3>3. Personal data</h3><p>Public officials' names and company information may already be public under procurement and access-to-information rules. Processing serves public interest, transparency and civic oversight. Affected individuals may request review, correction or removal.</p><h3>4. No warranty</h3><p>Software and data are provided as is, without warranty of any kind. Authors and contributors accept no liability for third-party use or decisions based on results. Use is solely the user's responsibility, under applicable law.</p><h3>5. Reply, correction and removal</h3><p>Mentioned individuals or entities may request review of incorrect, outdated or unfairly harmful records. Substantiated requests will be reviewed and, where appropriate, corrected or removed within a reasonable time. The prototype's correction form is a demonstration and does not send information.</p><h3>Acceptance record</h3><p>Version 1.0 and the acceptance timestamp are stored only in this browser. A new version requires new acceptance. If browser storage is unavailable, acceptance is requested again on reload.</p>`;

Motion.tokens.step=95;Motion.tokens.maxDelay=285;
let accepted=false,selectedSignal=0,language='es',dialogKind='',lastFocus=null,routeSerial=0,signalSerial=0,tour=false,tipTrigger=null,tipTimer,overlayFrame;
const acceptanceKey='coima.prismaV2.termsAcceptance';
try{const a=JSON.parse(localStorage.getItem(acceptanceKey));accepted=a?.version==='1.0'&&Number.isFinite(Date.parse(a.acceptedAt))}catch{}
const riskTip='Indicador automático, no acusación. Requiere revisión humana. Los registros del prototipo son ficticios.';
function info(text,label){return `<button class="info-button" type="button" data-tip="${text}" aria-label="${label}" aria-expanded="false">${icon('info')}</button>`}
function providerRows(list=companies){return list.map(c=>{const i=companies.indexOf(c);return `<a class="provider-row" href="#/empresa" ${i!==2?`data-company-preview="${i}"`:''}><span class="rank">${i+1}</span><span class="provider-info"><strong>${c.name}</strong></span>${badge(c.score)}</a>`}).join('')}
function panel(){return `<div class="title-row"><h1>Panel</h1><span class="chip">Ene-Sep 2026</span></div><section class="metrics" data-attention="1" aria-label="Resumen del análisis"><div class="metric"><div class="metric-label">Procesos analizados</div><div class="metric-value">12.400</div></div><div class="metric"><div class="metric-label">Proveedores</div><div class="metric-value">3.180</div></div><div class="metric"><div class="metric-label">Unidades contratantes</div><div class="metric-value">412</div></div></section><div class="analysis-grid"><section class="risk-panel" data-attention="2" aria-labelledby="risk-title"><div class="panel-head"><h2 id="risk-title">Mayor riesgo</h2><span class="risk-label">Riesgo ${info(riskTip,'Alcance del puntaje de riesgo')}</span></div>${providerRows()}</section><section class="detector-panel glass" data-attention="3" aria-labelledby="detectors-title"><div class="panel-head"><h2 id="detectors-title">Detectores</h2></div><div class="detector-head"><span>Detector</span><span class="detector-count-heading">Hallazgos ${info('Un proceso puede activar varios detectores.','Cómo se cuentan los hallazgos')}</span></div><ul class="detector-list">${detectors.map(d=>`<li><span>${d[0]}</span><b>${d[1]}</b></li>`).join('')}</ul></section></div><div class="next-action"><button class="btn primary" data-action="search" data-attention="4">Ver todos los proveedores ${icon('arrow')}</button></div>`}
function company(){selectedSignal=0;return `<section class="company-top glass" data-attention="1" aria-labelledby="company-name"><div class="company-actions"><button class="btn quiet" data-action="method">${icon('info')}Cómo se calcula</button><button class="btn quiet" data-action="network">${icon('network')}Ver red</button><button class="btn quiet" data-action="source">Ver en COMPR.AR ${icon('external')}</button></div><div class="company-heading"><h1 id="company-name">Distribuidora Ejemplo del Litoral S.A.</h1><div class="company-subline">CUIT 30-00000000-0</div></div><div class="risk-summary"><span class="risk-badge badge risk-high">Riesgo alto</span><div class="score">72<span> / 100</span></div><div class="risk-scale" role="meter" aria-label="Riesgo alto" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72"><span class="risk-scale-fill"></span><i style="left:40%"></i><i style="left:60%"></i><i style="left:80%"></i></div><div class="disclaimer">Indicador automático, no acusación. ${info('El puntaje orienta la revisión humana. No prueba irregularidades. Los registros del prototipo son ficticios.','Alcance del indicador automático')}</div></div></section><div class="company-grid glass"><section class="signals-section" data-attention="2" aria-labelledby="signals-title"><h2 id="signals-title">Señales (3)</h2><div class="signal-list" role="tablist" aria-label="Señales por contribución al puntaje"><i class="selection-indicator" aria-hidden="true"></i>${signals.map((s,i)=>`<button class="signal-btn ${i===0?'active':''}" id="signal-${i}" role="tab" data-signal="${i}" aria-selected="${i===0}" tabindex="${i===0?0:-1}" aria-controls="evidence"><h3>${s.name}</h3><p>${s.summary}</p><div class="contribution"><span class="bar" aria-hidden="true"><span style="width:${s.contribution/34*100}%"></span></span><b>+${s.contribution} puntos</b></div></button>`).join('')}</div></section><section class="evidence-shell" id="evidence" role="tabpanel" aria-labelledby="signal-0"><div class="evidence-stack" id="evidence-stack"><div id="evidence-content" data-attention="3">${evidenceContent(0)}</div></div><div class="evidence-next"><button class="btn primary" id="evidence-next-button" data-action="all-evidence" data-attention="4">Ver los 12 procesos ${icon('arrow')}</button></div></section></div>`}
function evidenceRows(index,all=false){const n=all?signals[index].count:5;return Array.from({length:n},(_,i)=>`<tr><td><a href="#/empresa" data-action="source">12-${String(34+index*30+i).padStart(4,'0')}-LPU26</a></td><td>${units[index===2?2:(i+index)%5]}</td><td>${money(evidenceAmount(index,i))}</td><td>${String(24-i%20).padStart(2,'0')}/09/2026</td></tr>`).join('')}
function evidenceTable(index,all=false){return `<div class="table-scroll" tabindex="0" role="region" aria-label="Procesos: deslizá para ver todas las columnas"><table class="evidence-table"><thead><tr><th scope="col">Proceso</th><th scope="col">Unidad</th><th scope="col">Monto (ARS)</th><th scope="col">Fecha</th></tr></thead><tbody>${evidenceRows(index,all)}</tbody></table></div>`}
function evidenceContent(index){return `<div class="evidence-head"><h2 aria-live="polite">Evidencia: ${signals[index].name}</h2></div>${evidenceTable(index)}`}
function moveIndicator(animate=true){const selected=$(`[data-signal="${selectedSignal}"]`),indicator=$('.selection-indicator'),list=$('.signal-list');if(!selected||!indicator)return;const horizontal=matchMedia('(max-width:760px)').matches;list.setAttribute('aria-orientation',horizontal?'horizontal':'vertical');const before=indicator.style.transform||'translate(0,0)';const transform=horizontal?`translateX(${selected.offsetLeft+selected.offsetWidth/2-30}px)`:`translateY(${selected.offsetTop}px)`;indicator.style.transform=transform;indicator.style.height=selected.offsetHeight+'px';if(animate)Motion.animate(indicator,[{transform:before},{transform}],{duration:240,easing:Motion.tokens.enter});}
async function selectSignal(index){if(index===selectedSignal)return;const serial=++signalSerial;selectedSignal=index;hideTip();$$('[data-signal]').forEach(el=>{const on=Number(el.dataset.signal)===index;el.classList.toggle('active',on);el.setAttribute('aria-selected',String(on));el.tabIndex=on?0:-1});moveIndicator();const old=$('#evidence-content'),stack=$('#evidence-stack');if(!old)return;$$('.evidence-ghost',stack).forEach(el=>el.remove());const ghost=old.cloneNode(true);ghost.removeAttribute('id');ghost.removeAttribute('data-attention');ghost.classList.add('evidence-ghost');ghost.setAttribute('aria-hidden','true');ghost.inert=true;stack.append(ghost);old.innerHTML=evidenceContent(index);$('#evidence').setAttribute('aria-labelledby',`signal-${index}`);$('#evidence-next-button').innerHTML=`Ver los ${signals[index].count} procesos ${icon('arrow')}`;const a=Motion.animate(ghost,[{opacity:1},{opacity:0}],{duration:180,easing:Motion.tokens.soft});const b=Motion.animate(old,[{opacity:0},{opacity:1}],{duration:240,easing:Motion.tokens.soft});scheduleOverlay();await Promise.all([a?.finished.catch(()=>{}),b?.finished.catch(()=>{})]);ghost.remove();if(serial===signalSerial)scheduleOverlay();}
function notFound(){return `<section class="not-found"><div class="celestial" data-attention="1"><svg viewBox="0 0 200 168" aria-hidden="true"><g fill="#9A752F">${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6-Math.PI/2;return star(100+69*Math.cos(a),84+65*Math.sin(a),2.5)}).join('')}</g><path class="moon" d="M112 51a35 35 0 1 0 15 57A29 29 0 0 1 112 51Z" fill="#CFEAF7" stroke="#8CB9CF"/></svg></div><div data-attention="2"><h1>Página no encontrada</h1><p>La dirección no existe.</p></div><div class="actions"><a class="btn primary" href="#/" data-attention="3">Ir al panel ${icon('arrow')}</a><button class="btn" data-action="search" data-attention="4">Buscar proveedor</button></div></section>`}
function entrance(root){const targets=$$('[data-attention]',root).sort((a,b)=>Number(a.dataset.attention)-Number(b.dataset.attention));Motion.stagger(targets);scheduleOverlay();setTimeout(scheduleOverlay,reduce.matches?0:500)}
async function renderRoute(animate=true){const serial=++routeSerial;hideTip();const screen=$('#screen');if(animate&&accepted)await Motion.exit(screen)?.finished.catch(()=>{});if(serial!==routeSerial)return;if(!accepted){screen.innerHTML='';return}const hash=location.hash||'#/',route=hash==='#/'?'panel':hash==='#/empresa'?'empresa':'404';screen.innerHTML=route==='panel'?panel():route==='empresa'?company():notFound();document.title=`${route==='panel'?'Panel':route==='empresa'?'Empresa':'Página no encontrada'} · Coima`;$$('[data-nav]').forEach(el=>{el.classList.toggle('active',el.dataset.nav===route);if(el.dataset.nav===route)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});$$('[data-switch]').forEach(el=>el.classList.toggle('current',el.dataset.switch===route));hydrate(screen);if(route==='empresa')requestAnimationFrame(()=>moveIndicator(false));entrance(screen);if(animate){screen.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
function termsContent(){const en=language==='en';const points=en?[['Automatic indicators','Patterns require human review.'],['Public data','Accuracy and completeness are not guaranteed.'],['Personal data','Processed for public-interest purposes.'],['No warranty','Use is your responsibility.'],['Correction requests','You may request review or removal.']]:[['Indicadores automáticos','Los patrones requieren revisión humana.'],['Datos públicos','Sin garantía de exactitud ni completitud.'],['Datos personales','Tratados con fines de interés público.'],['Sin garantías','Uso bajo tu responsabilidad.'],['Derecho de rectificación','Podés pedir revisión o baja.']];return `<div lang="${en?'en':'es-AR'}"><div class="dialog-brand"><span class="brand">${crown()}coima</span><div class="language" aria-label="${en?'Terms language':'Idioma de los términos'}"><button data-lang="es" class="${en?'':'active'}" aria-pressed="${!en}">ES</button><button data-lang="en" class="${en?'active':''}" aria-pressed="${en}">EN</button></div></div><h2 class="terms-title" id="dialog-title" data-attention="1">${en?'Terms of use':'Términos de uso'}</h2><ol class="terms-list" data-attention="2">${points.map(([title,detail],i)=>`<li><span class="term-num">${i+1}</span><div><strong>${title}</strong><p>${detail}</p></div></li>`).join('')}</ol><label class="check-row" data-attention="3"><input id="accept-check" type="checkbox">${en?'I have read and accept':'Leí y acepto'}</label><div class="dialog-actions"><button class="btn quiet" data-action="decline">${en?'Decline':'No acepto'}</button><button class="btn primary" id="accept-button" data-action="accept" data-attention="4" disabled>${en?'Accept and enter':'Aceptar y entrar'} ${icon('arrow')}</button></div><details class="legal-details"><summary>${en?'Full terms':'Términos completos'} ${icon('down')}</summary><div class="legal-copy">${en?legalEn:legalEs}</div></details></div>`}
function keepSwitcher(){const sw=$('#switcher');if(sw.parentElement!==document.body)document.body.append(sw)}
function mountTerms(){keepSwitcher();$('#dialog-content').innerHTML=termsContent();$('#dialog-content').append($('#switcher'));$$('[data-switch]').forEach(el=>el.classList.toggle('current',el.dataset.switch==='terms'));entrance($('#dialog-content'))}
function openDialog(kind,title,body=''){hideTip();const d=$('#dialog');if(!d.open)lastFocus=document.activeElement;keepSwitcher();dialogKind=kind;$('#dialog-content').innerHTML=kind==='terms'?termsContent():`<div class="dialog-title-row"><h2 id="dialog-title">${title}</h2><button class="btn quiet icon-btn" data-action="close" aria-label="Cerrar diálogo">${icon('close')}</button></div>${body}`;if(kind==='terms'){$('#dialog-content').append($('#switcher'));$$('[data-switch]').forEach(el=>el.classList.toggle('current',el.dataset.switch==='terms'))}hydrate(d);if(!d.open)d.showModal();d.scrollTop=0;Motion.enter(d,'modal');if(kind==='terms')entrance($('#dialog-content'));else if(kind==='search')$('#search-input').focus();scheduleOverlay()}
async function closeDialog(force=false){if(dialogKind==='terms'&&!force)return;hideTip();const d=$('#dialog');await Motion.exit(d,'modal')?.finished.catch(()=>{});keepSwitcher();d.close();dialogKind='';const hash=location.hash||'#/';$$('[data-switch]').forEach(el=>el.classList.toggle('current',el.dataset.switch===(hash==='#/'?'panel':hash==='#/empresa'?'empresa':'404')));if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});scheduleOverlay()}
function showTerms(){language='es';openDialog('terms','')}
function searchDialog(){openDialog('search','Buscar proveedor',`<label class="field">Nombre o CUIT<input type="search" id="search-input" autocomplete="off" placeholder="Nombre o CUIT"></label><div class="search-results" id="search-results">${providerRows()}</div>`)}
function method(){openDialog('method','Cómo se calcula',`<div class="formula">34 + 23 + 15 = <strong>72 / 100</strong></div>${signals.map(s=>`<div class="method-row"><span>${s.name}</span><strong>+${s.contribution}</strong></div>`).join('')}<details class="legal-details"><summary>Criterios y límites ${icon('down')}</summary><p>Contribución = peso × intensidad normalizada. Se suman las contribuciones, con un máximo de 100. Parámetros ficticios: 40 × 0,85 = 34; 30 × 0,7667 ≈ 23; 25 × 0,60 = 15.</p><p>Bajo: 0 a 39. Medio: 40 a 59. Alto: 60 a 79. Crítico: 80 a 100.</p></details>`)}
function network(){openDialog('network','Red del proveedor',`<div class="graph"><svg viewBox="0 0 460 225" role="img" aria-label="El proveedor y sus tres unidades contratantes"><g fill="none" stroke="#8299a5" stroke-width="1.5"><path d="M230 71V111H76V151M230 111v40M230 111h154v40"/></g><rect x="92" y="18" width="276" height="53" rx="12" fill="#EAF4FA" stroke="#8CB9CF"/><text x="230" y="42" text-anchor="middle">Distribuidora Ejemplo</text><text x="230" y="58" text-anchor="middle">del Litoral S.A.</text>${['Dirección Ejemplo','Agencia Ficticia','Unidad Demostración'].map((s,i)=>`<rect x="${i*154+3}" y="151" width="146" height="48" rx="9" fill="#fff" stroke="#ADC5D3"/><text x="${i*154+76}" y="180" text-anchor="middle">${s}</text>`).join('')}</svg></div>`)}
function rectify(){openDialog('rectify','Rectificación',`<p class="meta">Vista previa. No se envían datos.</p><form id="rectify-form"><label class="field">Registro o proceso<input name="record" required></label><label class="field">Qué dato querés revisar<textarea name="reason" required></textarea></label><button class="btn primary" type="submit">Previsualizar solicitud ${icon('arrow')}</button></form>`)}
function hideTip(){clearTimeout(tipTimer);$('#active-tip')?.remove();if(tipTrigger?.isConnected){tipTrigger.setAttribute('aria-expanded','false');tipTrigger.removeAttribute('aria-describedby')}tipTrigger=null}
function showTip(trigger){hideTip();tipTrigger=trigger;const tip=document.createElement('div');tip.id='active-tip';tip.className='tip';tip.setAttribute('role','tooltip');tip.textContent=trigger.dataset.tip;document.body.append(tip);trigger.setAttribute('aria-expanded','true');trigger.setAttribute('aria-describedby',tip.id);const r=trigger.getBoundingClientRect();tip.style.left=Math.min(Math.max(16,r.right-tip.offsetWidth),innerWidth-tip.offsetWidth-16)+scrollX+'px';const below=r.bottom+8;tip.style.top=(below+tip.offsetHeight>innerHeight?r.top-tip.offsetHeight-8:below)+scrollY+'px';tip.addEventListener('pointerenter',()=>clearTimeout(tipTimer));tip.addEventListener('pointerleave',()=>hideTip())}
function scheduleOverlay(){cancelAnimationFrame(overlayFrame);overlayFrame=requestAnimationFrame(drawOverlay)}
let overlayTargets=[];
function drawOverlay(){
 const overlay=$('#route-overlay'),d=$('#dialog'),terms=d.open&&dialogKind==='terms';
 const visible=tour&&(!d.open||terms),wasHidden=overlay.hasAttribute('hidden');
 // SVG elements need their actual hidden attribute updated.
 overlay.toggleAttribute('hidden',!visible);
 if(!visible){overlayTargets=[];overlay.replaceChildren();return}
 const host=terms?d:document.body;
 if(overlay.parentElement!==host)host.append(overlay);
 const root=terms?$('#dialog-content'):$('#screen');
 const targets=[1,2,3,4].map(n=>$('[data-attention="'+n+'"]',root)).filter(el=>el&&el.getClientRects().length);
 const width=document.documentElement.clientWidth,height=window.innerHeight;
 overlay.setAttribute('width',width);overlay.setAttribute('height',height);
 overlay.setAttribute('viewBox','0 0 '+width+' '+height);
 const bounds=overlay.getBoundingClientRect();
 const points=targets.map(el=>{const r=el.getBoundingClientRect();return {n:el.dataset.attention,x:r.left-bounds.left+12,y:r.top-bounds.top+12}});
 const changed=wasHidden||targets.length!==overlayTargets.length||targets.some((el,i)=>el!==overlayTargets[i]);
 if(changed){
  overlay.innerHTML='<path/>'+points.map(p=>'<g><circle r="12"/><text>'+p.n+'</text></g>').join('');
  overlayTargets=targets;
 }
 $('path',overlay).setAttribute('d',points.map((p,i)=>(i?'L':'M')+p.x+','+p.y).join(' '));
 $$('g',overlay).forEach((group,i)=>{const p=points[i];$('circle',group).setAttribute('cx',p.x);$('circle',group).setAttribute('cy',p.y);$('text',group).setAttribute('x',p.x);$('text',group).setAttribute('y',p.y)});
 if(changed){Motion.animate($('path',overlay),[{opacity:0},{opacity:1}],{duration:Motion.tokens.page,easing:Motion.tokens.enter});Motion.stagger($$('g',overlay))}
 // Follow target positions while their entrance animations are running.
 if(!reduce.matches&&targets.some(el=>el.getAnimations?.().some(a=>a.playState==='running')))scheduleOverlay();
}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b){if(!e.target.closest('.tip'))hideTip();return}if(b.dataset.tip){showTip(b);return}hideTip();if(b.dataset.route){e.preventDefault();if(!accepted){if(dialogKind!=='terms')showTerms();return}if($('#dialog').open)await closeDialog(true);if(location.hash===b.dataset.route)renderRoute();else location.hash=b.dataset.route;return}if(b.dataset.lang){const checked=$('#accept-check').checked;language=b.dataset.lang;mountTerms();$('#accept-check').checked=checked;$('#accept-button').disabled=!checked;$(`[data-lang="${language}"]`).focus();return}if(b.dataset.companyPreview!==undefined){e.preventDefault();const c=companies[Number(b.dataset.companyPreview)];openDialog('company-preview',c.name,`<div class="method-row"><span>Riesgo</span>${badge(c.score)}</div><div class="method-row"><span>Señales</span><strong>${c.signals}</strong></div><p class="meta" style="margin:20px 0">La ficha disponible es la de Distribuidora Ejemplo del Litoral S.A.</p><button class="btn primary" data-action="example-company">Abrir ficha disponible ${icon('arrow')}</button>`);return}if(b.dataset.signal!==undefined){await selectSignal(Number(b.dataset.signal));return}const action=b.dataset.action;if(action)e.preventDefault();if(action==='terms')showTerms();else if(action==='close')await closeDialog();else if(action==='accept'){if(!$('#accept-check').checked)return;accepted=true;try{localStorage.setItem(acceptanceKey,JSON.stringify({version:'1.0',acceptedAt:new Date().toISOString()}))}catch{}await closeDialog(true);await renderRoute();}else if(action==='decline'){accepted=false;try{localStorage.removeItem(acceptanceKey)}catch{}await closeDialog(true);++routeSerial;$('#screen').innerHTML=`<section class="not-found"><h1>Acceso no habilitado</h1><p>Necesitás aceptar los términos para entrar.</p><button class="btn primary" data-action="terms">Ver términos ${icon('arrow')}</button></section>`;$('#screen').focus();scheduleOverlay()}else if(action==='search'){if(accepted)searchDialog();else showTerms()}else if(action==='method')method();else if(action==='network')network();else if(action==='all-evidence')openDialog('processes',`Procesos (${signals[selectedSignal].count})`,evidenceTable(selectedSignal,true));else if(action==='source')openDialog('source','COMPR.AR',`<p class="meta">Este proceso ficticio no tiene una publicación oficial.</p><a class="btn" style="margin-top:20px" href="https://comprar.gob.ar/" target="_blank" rel="noopener noreferrer">Abrir COMPR.AR ${icon('external')}</a>`);else if(action==='rectify')rectify();else if(action==='example-company'){await closeDialog();if(location.hash==='#/empresa')renderRoute();else location.hash='#/empresa'}if(b.tagName==='A'&&b.getAttribute('href')?.startsWith('#/')){if(!accepted){e.preventDefault();showTerms()}else if($('#dialog').open)await closeDialog(true)}});
document.addEventListener('change',e=>{if(e.target.id==='accept-check')$('#accept-button').disabled=!e.target.checked;if(e.target.id==='tour-toggle'){tour=e.target.checked;scheduleOverlay()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();const tab=e.target.closest('[data-signal]');if(!tab)return;const horizontal=matchMedia('(max-width:760px)').matches,keys=horizontal?['ArrowLeft','ArrowRight']:['ArrowUp','ArrowDown'];let index=Number(tab.dataset.signal);if(e.key===keys[0])index=(index+signals.length-1)%signals.length;else if(e.key===keys[1])index=(index+1)%signals.length;else if(e.key==='Home')index=0;else if(e.key==='End')index=signals.length-1;else return;e.preventDefault();selectSignal(index);const next=$(`[data-signal="${index}"]`);next.focus({preventScroll:true});if(horizontal)next.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'})});
document.addEventListener('pointerover',e=>{const target=e.target.closest('[data-tip]');if(target&&tipTrigger!==target)showTip(target)});
document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]')&&!e.relatedTarget?.closest('[data-tip],.tip'))tipTimer=setTimeout(hideTip,180)});
document.addEventListener('focusin',e=>{if(e.target.matches('[data-tip]'))showTip(e.target)});
document.addEventListener('focusout',e=>{if(e.target.matches('[data-tip]'))hideTip()});
document.addEventListener('input',e=>{if(e.target.id!=='search-input')return;const normalize=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const q=normalize(e.target.value.trim());const matches=companies.filter(c=>normalize(c.name).includes(q)||(c===companies[2]&&'30-00000000-0'.includes(q)));$('#search-results').innerHTML=matches.length?providerRows(matches):'<p class="empty">No encontramos proveedores.</p>'});
document.addEventListener('submit',e=>{if(e.target.id!=='rectify-form')return;e.preventDefault();const data=new FormData(e.target);openDialog('rectify-preview','Solicitud de rectificación',`<p class="meta">Vista previa. No se envían datos.</p><div class="formula"><strong id="request-record"></strong><p id="request-reason" style="margin-top:12px;white-space:pre-wrap;font-size:13px"></p></div><button class="btn primary" data-action="close">Listo</button>`);$('#request-record').textContent=data.get('record');$('#request-reason').textContent=data.get('reason')});
$('#dialog').addEventListener('cancel',e=>{e.preventDefault();if(dialogKind!=='terms')closeDialog()});
document.addEventListener('toggle',scheduleOverlay,true);
window.addEventListener('hashchange',()=>renderRoute());window.addEventListener('resize',()=>{hideTip();moveIndicator(false);scheduleOverlay()});
document.addEventListener('scroll',scheduleOverlay,true);
document.fonts?.ready.then(()=>{moveIndicator(false);scheduleOverlay()});
hydrate();renderRoute(false);if(!accepted)showTerms();
</script>
